<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nitpick</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .header img {
      width: 24px;
      height: 24px;
    }
    .header h2 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
    }
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    input[type="password"],
    input[type="text"],
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f8fafc;
      font-size: 0.875rem;
      margin-bottom: 12px;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #6366f1;
    }
    textarea {
      height: 70px;
      resize: none;
    }
    .btn {
      width: 100%;
      padding: 10px;
      background-color: #4f46e5;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #4338ca;
    }
    .btn-secondary {
      background-color: #334155;
      margin-bottom: 12px;
    }
    .btn-secondary:hover {
      background-color: #475569;
    }
    #status {
      margin-top: 10px;
      font-size: 0.85rem;
      text-align: center;
      font-weight: 500;
    }
    .success {
      color: #4ade80;
    }
    .error {
      color: #f87171;
    }
  </style>
</head>
<body>
  <div className="header">
    <img src="../icons/icon128.png" alt="Nitpick" />
    <h2>Nitpick Bug Reporter</h2>
  </div>

  <div id="settingsSection">
    <label for="apiKey">Team API Key</label>
    <input type="password" id="apiKey" placeholder="bsnap_live_..." />
    <button id="saveKeyBtn" className="btn btn-secondary">Save API Key</button>
  </div>

  <div id="captureSection">
    <label for="note">Bug Note (Optional)</label>
    <textarea id="note" placeholder="What broke? (e.g. Button click threw console error)"></textarea>
    <button id="captureBtn" className="btn">Capture Bug</button>
  </div>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
